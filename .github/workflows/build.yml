name: Build experimental One UI App Lock APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'releases/**'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract source project
        shell: bash
        run: |
          cat parts/*.b64 | base64 -d > project.txz
          echo '75e2b75e5a93d0b49b86333e6fc2ed92e42a93ff4ac6a29d429032fc7ce6866b  project.txz' | sha256sum -c -
          tar -xJf project.txz
      - name: Add LSPosed recommended scope (v0.2)
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path("app/src/main/AndroidManifest.xml")
          source = manifest.read_text()
          anchor = '<meta-data android:name="xposedmodule" android:value="true" />'
          if anchor not in source:
              raise SystemExit("Missing legacy Xposed module marker")
          if 'android:name="xposedscope"' not in source:
              source = source.replace(anchor, anchor + '\n        <meta-data android:name="xposedscope" android:value="com.sec.android.app.launcher" />')
          manifest.write_text(source)
          scope = Path("app/src/main/assets/scope.list")
          scope.parent.mkdir(parents=True, exist_ok=True)
          scope.write_text("com.sec.android.app.launcher\n")
          gradle = Path("app/build.gradle")
          src = gradle.read_text().replace("versionCode 1", "versionCode 2").replace("versionName '0.1.0-prototype'", "versionName '0.2.0-scopefix'")
          gradle.write_text(src)
          print("AppLock legacy scope metadata and launcher recommended scope added")
          PY
      - name: Patch native launcher App Lock gate (v0.3)
        shell: bash
        run: |
          cp overrides/LauncherGateHook.java app/src/main/java/dev/oneui/applock/hooks/LauncherGateHook.java
          python3 - <<'PY'
          from pathlib import Path
          module = Path("app/src/main/java/dev/oneui/applock/hooks/AppLockModule.java")
          code = module.read_text()
          needle = "private void installLauncherHooks(ClassLoader cl) {\\n        try {"
          replacement = "private void installLauncherHooks(ClassLoader cl) {\\n        LauncherGateHook.install(cl);\\n        try {"
          needle = needle.replace("\\n", "\n")
          replacement = replacement.replace("\\n", "\n")
          if needle not in code:
              raise SystemExit("Launcher hook insertion marker not found")
          module.write_text(code.replace(needle, replacement, 1))
          gradle = Path("app/build.gradle")
          code = gradle.read_text().replace("versionCode 2", "versionCode 3").replace("versionName '0.2.0-scopefix'", "versionName '0.3.0-launcher-gate'")
          if "versionCode 3" not in code:
              raise SystemExit("Version upgrade failed")
          gradle.write_text(code)
          PY
      - name: Fix verified Xposed API signature and add diagnostics (v0.4)
        shell: bash
        run: |
          cp overrides/XposedHelpers.java xposedapi-stubs/src/main/java/de/robv/android/xposed/XposedHelpers.java
          cp overrides/XC_MethodHook.java xposedapi-stubs/src/main/java/de/robv/android/xposed/XC_MethodHook.java
          python3 - <<'PY'
          from pathlib import Path
          module = Path("app/src/main/java/dev/oneui/applock/hooks/AppLockModule.java")
          code = module.read_text()
          needle = '        if (MODULE.equals(p.packageName) || "android".equals(p.packageName)'
          replacement = '        if (LAUNCHER.equals(p.packageName) || "com.whatsapp".equals(p.packageName))\n            XposedBridge.log("AppLockLab v0.4: module loaded in " + p.packageName);\n' + needle
          if needle not in code:
              raise SystemExit("AppLockModule diagnostic insertion point not found")
          module.write_text(code.replace(needle, replacement, 1))
          gradle = Path("app/build.gradle")
          old = gradle.read_text()
          code = old.replace("versionCode 3", "versionCode 4").replace("versionName '0.3.0-launcher-gate'", "versionName '0.4.0-xposed-api-fix'")
          if code == old or "versionCode 4" not in code:
              raise SystemExit("App version upgrade did not apply")
          gradle.write_text(code)
          PY
      - name: Restore Samsung-style dialog and add opt-in enforcement (v0.5)
        shell: bash
        run: |
          cp overrides/LauncherGateHook.java app/src/main/java/dev/oneui/applock/hooks/LauncherGateHook.java
          cp overrides/LockToggleActivity.java app/src/main/java/dev/oneui/applock/ui/LockToggleActivity.java
          cp overrides/AppMonitorService.java app/src/main/java/dev/oneui/applock/ui/AppMonitorService.java
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree
          manifest = Path("app/src/main/AndroidManifest.xml")
          source = manifest.read_text()
          activity = '<activity\\n            android:name=".ui.LockToggleActivity"\\n            android:exported="true"'
          # Match the actual format of the extracted prototype's manifest.
          marker = 'android:name=".ui.LockToggleActivity"'
          if marker not in source:
              raise SystemExit("Missing LockToggleActivity declaration")
          source = source.replace(marker, marker + '\\n            android:theme="@style/AppLockDialogTheme"', 1)
          provider = '        <provider\\n'
          if provider not in source:
              raise SystemExit("Missing provider anchor")
          service = '''        <service
            android:name=".ui.AppMonitorService"
            android:label="App Lock monitor"
            android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
            android:exported="true">
            <intent-filter>
                <action android:name="android.accessibilityservice.AccessibilityService" />
            </intent-filter>
            <meta-data android:name="android.accessibilityservice"
                android:resource="@xml/applock_accessibility" />
        </service>
'''
          source = source.replace(provider, service + provider, 1)
          manifest.write_text(source)
          styles = Path("app/src/main/res/values/styles.xml")
          xml = styles.read_text()
          needle = '</resources>'
          if needle not in xml: raise SystemExit("Bad styles.xml")
          xml = xml.replace(needle, '''    <style name="AppLockDialogTheme" parent="android:style/Theme.Material.NoActionBar">
        <item name="android:windowIsTranslucent">true</item>
        <item name="android:windowBackground">@android:color/transparent</item>
        <item name="android:windowNoTitle">true</item>
        <item name="android:backgroundDimEnabled">true</item>
        <item name="android:windowDimAmount">0.61</item>
        <item name="android:colorAccent">#FFFFFF</item>
    </style>
''' + needle)
          styles.write_text(xml)
          layout = Path("app/src/main/res/xml")
          layout.mkdir(parents=True, exist_ok=True)
          (layout / "applock_accessibility.xml").write_text('''<?xml version="1.0" encoding="utf-8"?>
<accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
    android:accessibilityEventTypes="typeWindowStateChanged|typeWindowsChanged"
    android:accessibilityFeedbackType="feedbackGeneric"
    android:notificationTimeout="100"
    android:canRetrieveWindowContent="false"
    android:description="@string/app_lock_monitor_description" />
''')
          strings = Path("app/src/main/res/values/strings.xml")
          strings.write_text('''<?xml version="1.0" encoding="utf-8"?>
<resources>
    <string name="app_lock_monitor_description">Detects which app opens to prompt for authentication. Does not inspect screen content. Experimental protection, not a native Samsung security policy.</string>
</resources>
''')
          main = Path("app/src/main/java/dev/oneui/applock/ui/MainActivity.java")
          content = main.read_text()
          content = content.replace(
              "Choose apps to protect. After selecting an app, enable it in LSPosed Manager → One UI App Lock Lab → Scope, then force-stop and reopen that app.",
              "Choose apps to protect. To enforce locks for apps outside LSPosed scope, tap this card and enable App Lock monitor in Android Accessibility settings. The monitor uses foreground app names only.")
          content = content.replace("Locked · scope required", "Locked · monitor required")
          marker = "        layout.addView(info, ip);"
          if marker not in content: raise SystemExit("MainActivity insertion failed")
          content = content.replace(marker, marker + '\\n        info.setOnClickListener(v -> startActivity(new Intent(android.provider.Settings.ACTION_ACCESSIBILITY_SETTINGS)));')
          main.write_text(content)
          gradle = Path("app/build.gradle")
          content = gradle.read_text().replace("versionCode 4", "versionCode 5").replace("versionName '0.4.0-xposed-api-fix'", "versionName '0.5.0-dialog-monitor'")
          if "versionCode 5" not in content: raise SystemExit("Version number not patched")
          gradle.write_text(content)
          ElementTree.parse(manifest)
          ElementTree.parse(styles)
          ElementTree.parse(strings)
          ElementTree.parse(layout / "applock_accessibility.xml")
          print("Restored App Info hook, dark dialog and explicit monitor component")
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Validate compiled Xposed API descriptor and scope
        shell: bash
        run: |
          javap -classpath xposedapi-stubs/build/classes/java/main -s de.robv.android.xposed.XposedHelpers | grep -F 'XC_MethodHook$Unhook findAndHookMethod'
          ! javap -classpath xposedapi-stubs/build/classes/java/main -s de.robv.android.xposed.XposedHelpers | grep -F 'void findAndHookMethod'
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep 'assets/scope.list'
      - name: Check packaged scope file
        run: unzip -l app/build/outputs/apk/debug/app-debug.apk | grep 'assets/scope.list'
      - uses: actions/upload-artifact@v4
        with:
          name: Lock-Dialog-Monitor-v0.5-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish direct APK
        shell: bash
        run: |
          mkdir -p releases
          cp app/build/outputs/apk/debug/app-debug.apk releases/Lock-v0.5-monitor-debug.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f releases/Lock-v0.5-monitor-debug.apk
          git commit -m "Publish v0.5 dialog monitor debug APK [skip ci]" || exit 0
          git push
