name: Build experimental One UI App Lock APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'releases/**'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract source project
        shell: bash
        run: base64 -d project.txz.b64 | tar -xJ
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install SDK
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Lock-Experimental-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish direct APK
        shell: bash
        run: |
          mkdir -p releases
          cp app/build/outputs/apk/debug/app-debug.apk releases/Lock-experimental-debug.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f releases/Lock-experimental-debug.apk
          git commit -m "Publish experimental debug APK [skip ci]" || exit 0
          git push
